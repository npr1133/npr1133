<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <style>
       body {
            font-family: sans-serif;
            background-image: url("images/Taiwan 1.avif");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            display: flex;
            flex-direction: row; 
            min-height: 100vh;
        }

        .navbar {
            display: flex;
            flex-direction: column; 
            width: 200px;           
            height: 100vh;          
            background: rgb(33, 33, 193);
            box-shadow: 2px 0 6px rgba(0,0,0,0.2);
            padding: 2rem 1rem;
            box-sizing: border-box;
            position: sticky;       
            top: 0;
            left: 0;
            z-index: 1000;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            padding: 0.8rem 1rem;
            margin-bottom: 5px;
            border-radius: 4px;
            display: block;
            margin-left: 0 ;
        }

        .navbar a:hover {
            background: rgba(255,255,255,0.2);
        }

        .page-content {
            display: flex;
            flex: 1;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin-left: 0 
        }

        form {
            background-color: white ;
            padding: 30px;
            border-radius: 8px;
            width: 260px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            margin-left: 0 
        }

        form * {
            margin-left: initial ;
        }

        h2 {
            margin-top: 0 ;
            text-align: center;
        }

        label {
            display: block;
            margin: 10px 0 5px;
            font-size: 14px;
        }

        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid gray;
            border-radius: 4px;
        }

        .remember {
            margin: 15px 0;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: yellow;
            color: black;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: gold;
        }

        form a {
            display: block;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: blue;
        }

        @media screen and (max-width: 768px) {
            body {
                flex-direction: column;
            }

            .navbar br {
                display: none;
            }

            .navbar {
                width: 100%;
                height: auto;
                flex-direction: row;
                flex-wrap: wrap;
                position: relative;
                padding: 10px;
                justify-content: center;
                gap: 5px;
            }

            .navbar a {
                display: inline-block;
                margin-bottom: 0;
                padding: 0.5rem 0.8rem;
                font-size: 0.9rem;
            }

            .page-content {
                padding: 40px 20px;
            }
        }
    </style>
</head>
<body>
     <nav class="navbar">
        <a href="index.html" class="nav-li">Home</a>
        <a href="About.html" class="nav-li">About</a>
        <a href="Help.html" class="nav-li">Help</a>
        <a href="contact.html" class="nav-li">Contact</a>
        <a href="Galleries.html" class="nav-li">Galleries</a>
    </nav>
    

        <div class="page-content">
            <form>
                <h2>Log In</h2>
                
                <div class="field">
                    <label>Email</label>
                    <input type="email" placeholder="Enter your email" required>
                </div>
                
                <div class="field">
                    <label>Password</label>
                    <input type="password" placeholder="Enter your password" required>
                </div>
                
                <div class="remember">
                    <input type="checkbox" id="remember-me">
                    <label style="display:inline;" for="remember-me">Remember me</label>
                </div>
                
                <button type="submit" class="yellow-btn">Log In</button>
                
                <a href="Sign up.html">New to here? Sign up Here</a>
            </form>
        </div>

    </div>
</body>
