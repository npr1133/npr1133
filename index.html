<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Most popular places to visit in Taiwan</title>
    <style>
        body {
            background-image: url("images/Taiwan 1.avif");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            font-family: sans-serif;
        }

        .navbar {
            display: flex;
            flex-direction: column;
            width: 200px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            padding: 2rem 1rem;
            background: rgb(33, 33, 193);
            box-shadow: 2px 0 6px rgba(0,0,0,0.2);
            z-index: 1000;
            box-sizing: border-box;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            padding: 0.8rem 1rem;
            margin-bottom: 5px;
            border-radius: 4px;
            display: block;
        }

        .navbar a:hover {
            background: rgba(255,255,255,0.2);
        }

        .nav-login {
            margin-top: auto;
        }

        .content-wrapper {
            max-width: 1100px;
            margin-left: auto;
            margin-right: 60px;
            padding-top: 40px;
            padding-bottom: 40px;
            box-sizing: border-box;
        }

        .content-wrapper h1 {
            color: black;
            text-align: center;
            margin-bottom: 30px;
        }

        .cities-list {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-top: 40px;
        }

        .cities-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: yellow;
            font-weight: bold;
            width: 200px;
        }

        .cities-card img {
            width: 200px;
            height: 200px;
            border-radius: 15px;
            margin-bottom: 8px;
            object-fit: cover;
        }

        @media screen and (max-width: 768px) {
            .navbar br {
                display: none;
            }

            .navbar {
                width: 100%;
                height: auto;
                flex-direction: row;
                flex-wrap: wrap;
                position: relative;
                padding: 10px;
                justify-content: center;
                gap: 5px;
            }

            .navbar a {
                display: inline-block;
                margin-bottom: 0;
                padding: 0.5rem 0.8rem;
                font-size: 0.9rem;
            }

            .nav-login {
                margin-top: 0;
            }

            .content-wrapper {
                margin-left: auto;
                margin-right: auto;
                padding: 20px;
            }

            .content-wrapper h1 {
                font-size: 1.8rem;
                margin-bottom: 20px;
            }
        }
    </style>

</head>
<body>

            <a href="Taipei City.html" class="cities-card"><img src="images/Taipei City.jpg" alt="Taipei">Taipei City</a>
            <a href="New Taipei City.html" class="cities-card"><img src="images/New Taipei City.avif" alt="New Taipei City">New Taipei City</a>
            <a href="Kaohsiung City.html" class="cities-card"><img src="images/Kaohsiung City.avif" alt="Kaohsiung">Kaohsiung City</a>
